<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>शिक्षक डैशबोर्ड | educationdew</title><!--seo--><meta name="robots" content="noindex,follow"><meta name="author" content="educationdew.com"><meta property="og:type" content="website"><meta property="og:site_name" content="MP Board हल"><meta property="og:title" content="शिक्षक डैशबोर्ड | educationdew"><meta property="og:description" content=""><meta property="og:url" content="https://educationdew.com/teacher/"><meta property="og:locale" content="hi_IN"><meta property="og:image" content="https://educationdew.com/assets/og.png"><meta name="twitter:card" content="summary_large_image"><!--/seo-->
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --g: #16a34a; --b: #0284c7; --ink: #0f172a; --mut: #64748b; --line: #e2e8f0; --bg: #f8fafc; --card: #fff; --bad: #dc2626; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Noto Sans Devanagari", "Noto Sans", system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  header img { width: 28px; height: 32px; }
  header b { font-size: 17px; }
  header .wm .dew { background: linear-gradient(90deg, var(--g), var(--b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header button { margin-left: auto; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 0 0 10px; }
  .mut { color: var(--mut); font-size: 14px; }
  input[type=password], select { width: 100%; padding: 12px; font-size: 16px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; }
  button { font: inherit; padding: 10px 16px; border-radius: 10px; border: 0; background: linear-gradient(90deg, var(--g), var(--b)); color: #fff; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); font-weight: 500; padding: 7px 12px; }
  button.del { background: transparent; color: var(--bad); border: 1px solid #fecaca; padding: 4px 10px; font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .quiz { display: grid; gap: 6px; text-align: left; width: 100%; background: var(--card); color: var(--ink); border: 1.5px solid var(--line); font-weight: 400; }
  .quiz.on { border-color: var(--g); box-shadow: 0 0 0 3px #16a34a22; }
  .quiz b { font-size: 15px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
  .stat { background: var(--bg); border-radius: 10px; padding: 10px 12px; }
  .stat .v { font-size: 22px; font-weight: 700; } .stat .l { font-size: 13px; color: var(--mut); }
  .bar { height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; background: linear-gradient(90deg, #f97316, var(--bad)); }
  .bar.ok span { background: linear-gradient(90deg, var(--g), var(--b)); }
  ol.missed { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 12px; }
  ol.missed li { border-bottom: 1px dashed var(--line); padding-bottom: 10px; }
  .q { font-weight: 600; } .ans { font-size: 14px; color: var(--g); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--mut); font-weight: 500; }
  .err { color: var(--bad); font-size: 14px; }
  .spread { display: grid; gap: 8px; } .spread .row { flex-wrap: nowrap; } .spread .row span:first-child { width: 70px; font-size: 14px; } .spread .bar { flex: 1; } .spread .row span:last-child { width: 32px; text-align: right; font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><img src="/assets/logo-mark.svg" alt=""><span class="wm"><b>education<span class="dew">dew</span></b></span><span class="mut">· शिक्षक</span><button class="ghost" id="logout" hidden>बाहर निकलें</button></header>
<main>
  <section class="card" id="login">
    <h1>शिक्षक डैशबोर्ड</h1>
    <p class="mut">यह पेज केवल आपके लिए है। अपनी गुप्त चाबी डालें।</p>
    <form id="lf" class="row" style="display:grid;gap:10px">
      <input type="password" id="key" autocomplete="current-password" placeholder="गुप्त चाबी" required>
      <label class="mut"><input type="checkbox" id="remember" checked> इस फ़ोन पर याद रखें</label>
      <button type="submit">खोलें</button>
      <p class="err" id="lerr" hidden></p>
    </form>
  </section>

  <section class="card" id="ov" hidden>
    <h2>सभी क्विज़</h2>
    <div id="quizzes" style="display:grid;gap:10px"></div>
    <p class="mut" id="none" hidden>अभी तक किसी विद्यार्थी ने क्विज़ पूरा नहीं किया है।</p>
  </section>

  <section id="detail" hidden style="display:grid;gap:16px">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 id="dtitle" style="margin:0"></h2>
        <select id="days" style="width:auto">
          <option value="7">पिछले 7 दिन</option><option value="30" selected>पिछले 30 दिन</option><option value="365">पिछला 1 साल</option><option value="3650">शुरू से</option>
        </select>
      </div>
      <div class="stats" style="margin-top:12px">
        <div class="stat"><div class="v" id="s-att">0</div><div class="l">प्रयास</div></div>
        <div class="stat"><div class="v" id="s-avg">–</div><div class="l">औसत अंक</div></div>
        <div class="stat"><div class="v" id="s-time">–</div><div class="l">औसत समय</div></div>
      </div>
    </div>
    <div class="card"><h2>अंकों का बँटवारा</h2><div class="spread" id="spread"></div></div>
    <div class="card"><h2>सबसे ज़्यादा गलत हुए प्रश्न</h2><p class="mut">कक्षा में इन्हें दोबारा समझाएँ।</p><ol class="missed" id="missed"></ol></div>
    <div class="card"><h2>हाल के प्रयास</h2><div style="overflow-x:auto"><table><thead><tr><th>नाम</th><th>अंक</th><th>समय</th><th>कब</th><th></th></tr></thead><tbody id="recent"></tbody></table></div></div>
  </section>
</main>
<iframe id="qf" hidden title="quiz"></iframe>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = localStorage.getItem("ed_admin_key") || sessionStorage.getItem("ed_admin_key") || "";
  var cur = null, qcache = {};
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  function api(path, opt) {
    opt = opt || {}; opt.headers = Object.assign({ authorization: "Bearer " + KEY, "content-type": "application/json" }, opt.headers || {});
    return fetch(path, opt).then(function (r) { if (r.status === 401) throw new Error("401"); return r.json(); });
  }
  function pageOf(id) { var p = id.split("/"); return "/" + p[0] + "/quiz/" + p.slice(1).join("/") + "/"; }
  function quizInfo(id) {   // question texts come from the quiz page itself (single source of truth)
    if (qcache[id]) return qcache[id];
    return qcache[id] = new Promise(function (res) {
      var f = $("qf"); var done = false;
      var finish = function (v) { if (!done) { done = true; res(v); } };
      f.onload = function () { try { var w = f.contentWindow; finish({ title: w.document.title.split("|")[0].trim(), questions: (w.ED_QUIZ || {}).questions || [] }); } catch (e) { finish({ title: id, questions: [] }); } };
      setTimeout(function () { finish({ title: id, questions: [] }); }, 8000);
      f.src = pageOf(id);
    });
  }
  function ago(t) {
    var d = Math.floor(Date.now() / 1000) - t;
    if (d < 3600) return Math.max(1, Math.round(d / 60)) + " मिनट पहले";
    if (d < 86400) return Math.round(d / 3600) + " घंटे पहले";
    return new Date(t * 1000).toLocaleDateString("hi-IN", { day: "numeric", month: "short" });
  }
  function mmss(s) { if (s == null) return "–"; s = Math.round(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function showLogin(msg) { $("login").hidden = false; $("ov").hidden = $("detail").hidden = $("logout").hidden = true; $("lerr").hidden = !msg; $("lerr").textContent = msg || ""; }
  function loadOverview() {
    api("/api/admin/overview").then(function (d) {
      $("login").hidden = true; $("ov").hidden = false; $("logout").hidden = false;
      var qs = d.quizzes || []; $("none").hidden = qs.length > 0;
      $("quizzes").innerHTML = "";
      qs.forEach(function (q) {
        var b = document.createElement("button"); b.className = "quiz"; b.type = "button";
        b.innerHTML = "<b>" + esc(q.quiz) + '</b><span class="mut">' + q.attempts + " प्रयास · इस हफ़्ते " + (q.last7 || 0) + " · औसत " + q.avg_pct + "% · आख़िरी " + ago(q.last_at) + "</span>";
        quizInfo(q.quiz).then(function (i) { b.querySelector("b").textContent = i.title; });
        b.onclick = function () { [].forEach.call(document.querySelectorAll(".quiz"), function (x) { x.classList.remove("on"); }); b.classList.add("on"); cur = q.quiz; loadDetail(); };
        $("quizzes").appendChild(b);
      });
      if (qs.length && !cur) $("quizzes").firstChild.click();
    }).catch(function (e) { if (e.message === "401") { forget(); showLogin("चाबी सही नहीं है।"); } else showLogin("सर्वर से जुड़ नहीं पाए। थोड़ी देर बाद फिर खोलें।"); });
  }
  function loadDetail() {
    var days = $("days").value;
    Promise.all([api("/api/admin/quiz?quiz=" + encodeURIComponent(cur) + "&days=" + days), quizInfo(cur)]).then(function (r) {
      var d = r[0], info = r[1], Q = info.questions;
      $("detail").hidden = false; $("dtitle").textContent = info.title;
      $("s-att").textContent = d.attempts || 0;
      $("s-avg").textContent = d.avg_pct == null ? "–" : d.avg_pct + "%";
      $("s-time").textContent = mmss(d.avg_seconds);
      var bands = ["80-100", "60-79", "40-59", "0-39"], m = {}; (d.spread || []).forEach(function (x) { m[x.band] = x.n; });
      var tot = d.attempts || 1;
      $("spread").innerHTML = bands.map(function (b) { var n = m[b] || 0; return '<div class="row"><span>' + b + '%</span><div class="bar ok"><span style="width:' + (n * 100 / tot) + '%"></span></div><span>' + n + "</span></div>"; }).join("");
      $("missed").innerHTML = (d.missed || []).slice(0, 10).map(function (x) {
        var q = Q[x.question] || {}; var pct = Math.round(x.wrong * 100 / tot);
        return '<li><div class="q">' + esc(q.q || ("प्रश्न " + (x.question + 1))) + "</div>" +
          (q.o ? '<div class="ans">सही उत्तर: ' + esc(q.o[q.a]) + "</div>" : "") +
          '<div class="row" style="margin-top:6px"><div class="bar" style="flex:1"><span style="width:' + pct + '%"></span></div><span class="mut">' + x.wrong + " बार गलत (" + pct + "%)</span></div></li>";
      }).join("") || '<li class="mut">इस अवधि में कोई गलती दर्ज नहीं।</li>';
      $("recent").innerHTML = (d.recent || []).map(function (a) {
        return "<tr><td>" + esc(a.name || "—") + "</td><td>" + a.score + "/" + a.total + "</td><td>" + mmss(a.seconds) + "</td><td>" + ago(a.at) + '</td><td><button class="del" data-id="' + a.id + '">हटाएँ</button></td></tr>';
      }).join("") || '<tr><td colspan="5" class="mut">कोई प्रयास नहीं।</td></tr>';
    }).catch(function (e) { if (e.message === "401") { forget(); showLogin("चाबी सही नहीं है।"); } });
  }
  function forget() { localStorage.removeItem("ed_admin_key"); sessionStorage.removeItem("ed_admin_key"); KEY = ""; }
  $("recent").addEventListener("click", function (e) {
    var id = e.target.getAttribute && e.target.getAttribute("data-id"); if (!id) return;
    if (!confirm("यह प्रयास हटाएँ? यह वापस नहीं आएगा।")) return;
    api("/api/admin/attempts/delete", { method: "POST", body: JSON.stringify({ id: Number(id) }) }).then(function () { loadDetail(); loadOverview(); });
  });
  $("days").onchange = loadDetail;
  $("lf").onsubmit = function (e) {
    e.preventDefault(); KEY = $("key").value.trim();
    ($("remember").checked ? localStorage : sessionStorage).setItem("ed_admin_key", KEY);
    loadOverview();
  };
  $("logout").onclick = function () { forget(); cur = null; $("key").value = ""; showLogin(); };
  if (KEY) loadOverview(); else showLogin();
})();
</script>
</body>
</html>
